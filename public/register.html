<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>📝 Crear Cuenta Admin</h2>
    <form id="register-form">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="auth-btn">Registrar</button>
    </form>
    
    <p id="msg" class="error-text"></p>

    <div class="auth-switch">
      <p>¿Ya tienes una cuenta?</p>
      <a href="login.html" class="secondary-btn">Iniciar Sesión</a>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        const msgElement = document.getElementById('msg');
        if (res.ok) {
          msgElement.style.color = '#38ef7d';
          msgElement.textContent = '✅ Usuario creado correctamente. Redirigiendo...';
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          msgElement.style.color = '#ff6b6b';
          msgElement.textContent = data.message;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('msg').textContent = 'Error de conexión con el servidor.';
      }
    });
  </script>
</body>
</html>
