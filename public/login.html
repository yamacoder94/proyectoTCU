<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="img/Screenshot 2026-08-18 at 06.33.24.png" alt="Logo Colegio">
    </div>
    <h2>🔑 Iniciar Sesión</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="auth-btn">Entrar</button>
    </form>
    
    <p id="error-msg" class="error-text"></p>

    <div class="auth-switch">
      <p>¿No tienes una cuenta?</p>
      <a href="register.html" class="secondary-btn">Registrarse</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('token', data.token);
          
          if (data.user) {
            sessionStorage.setItem('user', JSON.stringify(data.user));
          } else if (data.userRole) {
            sessionStorage.setItem('user', JSON.stringify({ userRole: data.userRole }));
          }

          window.location.href = 'index.html';
        } else {
          document.getElementById('error-msg').textContent = data.message;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('error-msg').textContent = 'Error de conexión con el servidor.';
      }
    });
  </script>
</body>
</html>
